[package]
name = "arvolo-ipc"
description = "Arvolo daemon IPC wire contract + client — shared by the CLI and the desktop GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
arvolo-core.workspace = true
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
# The client half speaks the control channel on both platforms now — a unix socket
# there, a named pipe here — so tokio is no longer unix-only. Which of the two it
# opens is decided in `client::open`; everything above that is the same protocol.
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
