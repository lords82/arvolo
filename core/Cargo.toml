[package]
name = "arvolo-core"
description = "Arvolo shared core: end-to-end encryption, chunked P2P transfer, and relay-backfill engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "p2p", "e2ee", "encryption", "hpke"]
categories = ["network-programming", "cryptography"]

[dependencies]
anyhow.workspace = true
tokio = { workspace = true }
tracing.workspace = true
iroh = "0.95.1"
# Same crate iroh 0.95.1 links against — needed only for `congestion::BbrConfig`,
# which iroh re-exports the traits of but not the concrete controllers.
iroh-quinn-proto = "0.13"
rand = "0.9"
postcard = { version = "1", features = ["alloc"] }
data-encoding = "2"

# --- transitive crypto pin (iroh 0.95.1 was built against the RustCrypto rc
# cohort; the later final releases changed APIs and break the build). Pin the
# whole cohort to the exact pre-release versions iroh expects. Not used directly. ---
der = "=0.8.0-rc.9"
spki = "=0.8.0-rc.4"
pkcs8 = "=0.11.0-rc.7"
ed25519 = "=3.0.0-rc.0"
# The identity's signing half. `hazmat` is required, not incidental: signing with a
# per-epoch *blinded* scalar means handing the signer a scalar directly, and every
# safe API clamps — which would break the correspondence with the blinded public key
# (see `crypto::blinded`).
ed25519-dalek = { version = "3.0.0-pre.1", features = ["hazmat", "digest"] }
# Must be the exact version `ed25519-dalek` links against: the blinded `Scalar` we
# hand to `hazmat` has to be *that* crate's type, and two curve25519-dalek majors in
# the tree would make it a different one.
curve25519-dalek = "=5.0.0-pre.1"
signature = "=3.0.0-rc.3"
blake3 = "1"
# Wiping the identity seed on drop; already in the tree via the dalek crates.
zeroize = "1"
hpke = "0.13.0"
aes-gcm = "0.10"
argon2 = "0.5"
spake2 = "0.4.0"
serde = { version = "1", features = ["derive"] }
# `socks` so ARVOLO_PROXY can name a SOCKS5 proxy (Tor: socks5h://127.0.0.1:9050),
# not only an HTTP one — see `crate::http`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
tokio-util = { version = "0.7", features = ["io"] }
# Build the mailbox-upload body as a lazy stream that seals chunks on the fly, so
# a deposit never spools the whole ciphertext to disk first.
async-stream = "0.3"
tar = "0.4"

# Unix `statvfs` for a best-effort pre-flight free-space check before a download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The same check on Windows (`GetDiskFreeSpaceExW`). Both crates are already in
# the tree transitively, so neither adds a build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
iroh = { version = "0.95.1", features = ["test-utils"] }
