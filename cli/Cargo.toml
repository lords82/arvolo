[package]
name = "arvolo-cli"
description = "Arvolo — secure, end-to-end-encrypted cross-platform file sending (P2P + expiring zero-knowledge relay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "p2p", "e2ee", "encryption", "cli"]
categories = ["command-line-utilities", "network-programming", "cryptography"]

[[bin]]
name = "arvolo"
path = "src/main.rs"

[dependencies]
arvolo-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util = "0.7"
data-encoding = "2"
indicatif = "0.17"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Desktop notifications for the daemon (offer awaiting approval). Cross-platform
# (D-Bus/macOS/WinRT); best-effort — degrades to a log line when unavailable.
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
arvolo-core.workspace = true
data-encoding = "2"
# Spin up a real relay in-process for the multi-device CLI end-to-end test.
arvolo-relay = { path = "../relay" }
axum = "0.8"
