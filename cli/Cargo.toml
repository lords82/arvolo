[package]
name = "arvolo-cli"
description = "Arvolo — secure, end-to-end-encrypted cross-platform file sending (P2P + expiring zero-knowledge relay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "p2p", "e2ee", "encryption", "cli"]
categories = ["command-line-utilities", "network-programming", "cryptography"]

[[bin]]
name = "arvolo"
path = "src/main.rs"

[dependencies]
arvolo-core.workspace = true
arvolo-ipc.workspace = true
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util = "0.7"
data-encoding = "2"
indicatif = "0.17"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Desktop notifications for the daemon (offer awaiting approval). Cross-platform
# (D-Bus/macOS/WinRT); best-effort — degrades to a log line when unavailable.
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# TTY password prompt for the bare `--password` form (never a plaintext argv).
rpassword = "7"

# flock(2) for the daemon's kernel-enforced single-instance lock (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
arvolo-core.workspace = true
data-encoding = "2"
# Spin up a real relay in-process for the multi-device CLI end-to-end test.
arvolo-relay = { path = "../relay" }
axum = "0.8"

# ---- distro packages -------------------------------------------------------
#
# Two packages, not one: whoever installs the relay on a server does not want the
# client daemon, and whoever installs the client does not want a relay. The
# tarball ships both together because a tarball has no way to say "these are
# separate things"; a package does.
#
# Neither binary links anything but libc — no GTK, no webkit — so one package
# works on every distribution whose glibc is at least the builder's. That is the
# whole reason these are easy while a package of the desktop app is not: see the
# release workflow for which runner builds them, and why an older one is chosen.

[package.metadata.deb]
name = "arvolo"
maintainer = "Lorenzo Bonacucina <info@termox.it>"
section = "utils"
priority = "optional"
extended-description = """\
Send files directly between devices, end-to-end encrypted. Transfers go peer to \
peer; when a relay is needed it holds ciphertext only and you can host it \
yourself. This package installs the command-line tool and its background daemon."""
# `$auto` lets cargo-deb read the built binary and write the real dependency —
# in practice the glibc floor of the machine that compiled it. Written by hand it
# would be a guess, and the failure mode of guessing low is a package that
# installs and then dies at the first symbol it cannot find.
depends = "$auto"
assets = [
    ["target/release/arvolo", "usr/bin/", "755"],
    ["../packaging/arvolo.packaged.service", "usr/lib/systemd/user/arvolo.service", "644"],
    ["../README.md", "usr/share/doc/arvolo/README.md", "644"],
    ["../docs/MANUAL.md", "usr/share/doc/arvolo/MANUAL.md", "644"],
    ["../docs/QUICKSTART.md", "usr/share/doc/arvolo/QUICKSTART.md", "644"],
]
# Hand-written, because the unit above is a *user* unit and cargo-deb's
# `systemd-units` table only knows system ones — pointed at this, it would install
# the service under /usr/lib/systemd/system and start it as root. See the scripts
# for what they do and why they cannot restart anything.
maintainer-scripts = "../packaging/deb"

[package.metadata.generate-rpm]
name = "arvolo"
assets = [
    { source = "target/release/arvolo", dest = "/usr/bin/arvolo", mode = "755" },
    { source = "packaging/arvolo.packaged.service", dest = "/usr/lib/systemd/user/arvolo.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/arvolo/README.md", mode = "644" },
    { source = "docs/MANUAL.md", dest = "/usr/share/doc/arvolo/MANUAL.md", mode = "644" },
    { source = "docs/QUICKSTART.md", dest = "/usr/share/doc/arvolo/QUICKSTART.md", mode = "644" },
]

# The same registration on the RPM side. `--global` is the user-unit equivalent
# of enable: it links the unit for every user's session manager, which is all a
# root scriptlet can do — starting it belongs to the session, not to here.
post_install_script = """
systemctl --global enable arvolo.service >/dev/null 2>&1 || :
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl --global disable arvolo.service >/dev/null 2>&1 || :
fi
"""
