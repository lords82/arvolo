[package]
name = "arvolo-engine"
description = "Arvolo's client engine: the address book, config and daemon logic, without a socket or a terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "p2p", "e2ee"]
categories = ["network-programming", "cryptography"]

[dependencies]
arvolo-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Just the hostname, for the default name of this machine in the device register.
gethostname = "0.5"

[dev-dependencies]
tempfile = "3"
