services:
  arvolo-relay:
    # Uses the published image by default. For local development, comment out
    # `image:` and uncomment `build:` to build from source.
    image: ghcr.io/lords82/arvolo-relay:latest
    # build:
    #   context: .
    #   dockerfile: relay/Dockerfile
    container_name: arvolo-relay
    restart: always
    # Public shared-relay cost controls. This is the free "bootstrap + short-lived
    # mailbox" tier: pairing codes, direct P2P, and offline delivery for small
    # files. The expensive, amplifying features (public browser download links,
    # large blobs, long retention) are reserved for self-hosted / paid relays.
    #   - DISABLE_LINKS: no re-downloadable public links → egress stays ~= ingest.
    #   - MAX_TTL 24h, MAX_BLOB 0.5 GiB, MAX_ENTRIES 20k → bounded worst-case disk.
    #   - MAX_SESSION_RELAY_BYTES 0.5 GiB: how many bytes a single P2P transfer may
    #     lean on this relay (backfill). Past it the sender falls back to direct
    #     P2P. The software default (0 = unlimited) is left for private relays.
    # A private relay can drop this block to run with the generous defaults.
    environment:
      ARVOLO_DISABLE_LINKS: "1"
      ARVOLO_MAX_TTL: "86400"
      ARVOLO_MAX_BLOB_BYTES: "536870912"
      ARVOLO_MAX_ENTRIES: "20000"
      ARVOLO_MAX_SESSION_RELAY_BYTES: "536870912"
    # No host port publish in production: a TLS-terminating reverse proxy on the
    # same Docker network reaches the relay by its service name (arvolo-relay:6282).
    # Publishing 6282 to the host would expose the relay in plaintext, bypassing
    # TLS — uncomment only for a local, non-public dev run.
    # ports:
    #   - "6282:6282"
    volumes:
      - arvolo-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6282/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  arvolo-data:
