[workspace]
resolver = "2"
members = ["core", "cli", "relay", "arvolo-ipc", "gui/src-tauri"]

[workspace.package]
version = "0.12.0-rc4"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/lords82/arvolo"
homepage = "https://github.com/lords82/arvolo"

[workspace.dependencies]
# shared deps pinned once for all crates
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# Shell completions. The dynamic engine (contact names after `send`, live ids
# after `cancel`) lives behind `unstable-dynamic`, which clap may break on a
# minor bump — hence the exact pin. All use of it is confined to
# `cli/src/completions.rs` so a future break is repaired in one place.
clap_complete = { version = "=4.6.8", features = ["unstable-dynamic"] }
# Both a path (for local builds) and a version (required so the binary crates
# can be published to crates.io referencing a released core).
arvolo-core = { path = "core", version = "0.12.0-rc4" }
# The IPC wire contract + daemon client, shared by the CLI and the GUI backend.
arvolo-ipc = { path = "arvolo-ipc", version = "0.12.0-rc4" }

# Dependencies at opt-level 2 even in dev/test builds. Without this the whole
# crypto and transfer stack (BLAKE3, the chunk AEAD, iroh) runs unoptimized in
# `cargo test`, and on Apple Silicon that means ~120-180 KB/s data paths: every
# bulk-transfer test (coswarm above all) then fails on any deadline while the
# release binary saturates the line. Workspace crates stay at opt-level 0, so
# debugging our own code is unaffected; dependencies compile once and are cached.
[profile.dev.package."*"]
opt-level = 2
