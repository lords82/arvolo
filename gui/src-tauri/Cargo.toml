[package]
name = "arvolo-gui"
description = "Arvolo — desktop GUI (Tauri) for the P2P + relay file sender."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` decodes the menu-bar template glyph baked in with `include_bytes!`.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
# The daemon client + wire contract, shared with the CLI.
arvolo-ipc.workspace = true

# Signalling the daemon for the in-app restart (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Pin `time` to the last release whose `Parsable::parse` API `cookie 0.18` (pulled
# transitively by tauri/wry) compiles against — 0.3.52 shipped a breaking change in
# a patch release. Constrains the shared workspace lock; harmless for the others.
time = "=0.3.51"

# A desktop-only binary (no mobile). Silence the unused-import lint on Windows,
# where the unix-socket client is absent until the named-pipe phase.
[lints.rust]
unexpected_cfgs = { level = "allow" }
