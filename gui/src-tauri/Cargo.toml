[package]
name = "arvolo-gui"
description = "Arvolo — desktop GUI (Tauri) for the P2P + relay file sender."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# The binary stays `arvolo-gui`, and it cannot be called `Arvolo`.
#
# v0.13.0 renamed it — the program a person meets should say its own name in
# Activity Monitor and in `ps` — and that release shipped with no `.dmg` and no
# `.msi`, because the CLI travels inside the bundle as a sidecar named `arvolo`
# and lands in the same directory as the main binary. macOS and Windows compare
# filenames without case: `Arvolo` and `arvolo` are one name there, so the two
# files collide. Notarization refused the app ("the signature of the binary is
# invalid" on `Contents/MacOS/arvolo`) and WiX refused to link the installer.
#
# Renaming the program therefore means renaming the sidecar first — and the
# sidecar is what a Windows user types in a terminal after the installer puts it
# on PATH, so that is a decision with its own consequences, not a one-line
# rename. Until it is taken, this file leaves the binary name alone.
[build-dependencies]
tauri-build = { version = "2", features = [] }

# A library as well as a binary: on mobile there is no process to start, only a
# shared object the platform's activity loads and enters at `run`. The desktop
# binary is four lines that call the same function.
[lib]
name = "arvolo_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The engine itself, and only where there is no daemon to run it: a desktop
# spawns the CLI and talks to it over a socket, and linking the engine into the
# window as well would be a second copy of it in the same house.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
arvolo-engine.workspace = true
# The token the engine stops on.
tokio-util = "0.7"
# The camera, for reading a code off another device's screen. Mobile only in
# every sense: the plugin has no desktop implementation, and a desktop has the
# code in its clipboard rather than in front of a lens.
tauri-plugin-barcode-scanner = "2"

[dependencies]
# `image-png` decodes the menu-bar template glyph baked in with `include_bytes!`.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# In-app updates. Registered for the plugin state alone: every call goes through
# `UpdaterExt` in `bridge.rs`, never from the webview, because pointing at one
# release's own manifest instead of `latest.json` needs the Rust builder. So the
# JS side of the plugin is unused and the webview is granted nothing.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minting unguessable ids for picked files (bridge::PickedFiles) and encoding them.
rand = "0.9"
data-encoding = "2"
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The daemon client + wire contract, shared with the CLI.
arvolo-ipc.workspace = true
# Only for `http::client()`, to fetch the update compatibility table. Already in
# the tree (arvolo-ipc pulls it), so this costs nothing to link — and it is the
# right client rather than merely a convenient one: it honours ARVOLO_PROXY, so
# someone who routed arvolo through Tor does not get one bare request to
# github.com out the side.
arvolo-core.workspace = true

# Handing AppKit the Dock icon again after the window comes back from the tray,
# and posting notifications through UNUserNotificationCenter — the plugin's backend
# (NSUserNotificationCenter, deprecated in 10.14) delivers nothing on current macOS.
# Same versions Tauri itself pulls, so nothing is duplicated in the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSData",
    "NSError",
    "NSString",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

# Signalling the daemon for the in-app restart (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Pin `time` to the last release whose `Parsable::parse` API `cookie 0.18` (pulled
# transitively by tauri/wry) compiles against — 0.3.52 shipped a breaking change in
# a patch release. Constrains the shared workspace lock; harmless for the others.
time = "=0.3.51"

# A desktop-only binary (no mobile). Silence the unused-import lint on Windows,
# where the unix-socket client is absent until the named-pipe phase.
[lints.rust]
unexpected_cfgs = { level = "allow" }
