<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` mean anything:
         without it the system reserves the notch and the home indicator itself,
         the page never learns their size, and the app is letterboxed on a phone.
         With it the page fills the screen and keeps its own content clear of
         them — see the PHONE block in theme.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Arvolo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
