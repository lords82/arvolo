[package]
name = "arvolo-relay"
description = "Arvolo self-hostable zero-knowledge relay / mailbox (store-and-forward with expiry)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "relay", "zero-knowledge", "mailbox", "p2p"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "arvolo-relay"
path = "src/main.rs"

[dependencies]
arvolo-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
data-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"

[dev-dependencies]
arvolo-core.workspace = true
# The inbox tests assemble a session token by hand, to check that a signature from
# the wrong identity is refused.
postcard = { version = "1", features = ["alloc"] }
tempfile = "3"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7" }
http-body-util = "0.1"
data-encoding = "2"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# ---- distro packages -------------------------------------------------------
#
# The binary plus a systemd unit that is present but NOT enabled. Shipping a
# service means answering three questions — which user, where the data lives,
# how it is configured — and the unit answers them without deciding anything
# for the operator: DynamicUser (a user that exists only while it runs),
# StateDirectory=/var/lib/arvolo-relay, and /etc/default/arvolo-relay for
# everything an operator would want different. Nothing starts on install: a
# relay with no domain and no TLS proxy in front has nothing useful to do, so
# enabling it is left as the operator's explicit `systemctl enable --now`.

[package.metadata.deb]
name = "arvolo-relay"
maintainer = "Lorenzo Bonacucina <info@termox.it>"
section = "net"
priority = "optional"
extended-description = """\
The self-hostable Arvolo relay: store-and-forward mailbox, rendezvous and swarm \
tracker. It never sees plaintext or keys — only ciphertext and opaque tokens."""
depends = "$auto"
assets = [
    ["target/release/arvolo-relay", "usr/bin/", "755"],
    # The unit is NOT listed here: `systemd-units` below adds it, and adding it
    # twice packages it twice.
    # Under /etc, so cargo-deb marks it a conffile: operator edits survive upgrades.
    ["../packaging/arvolo-relay.default", "etc/default/arvolo-relay", "644"],
    ["../docs/DEPLOY.md", "usr/share/doc/arvolo-relay/DEPLOY.md", "644"],
]
# Required by `systemd-units`, even with nothing in it: cargo-deb writes the
# generated fragments into scripts of its own when the directory holds none.
maintainer-scripts = "../packaging/systemd"

# What a distribution package is expected to do with a service, minus the part
# this one deliberately does not want.
#
# `enable`/`start` false keeps the promise made above: nothing turns on at
# install, because a relay with no domain and no TLS proxy in front has nothing
# useful to do. What was missing is the other half — an upgrade replaced the
# binary and left the old process running, so `apt upgrade` on a relay someone
# had enabled changed nothing until they noticed and restarted it by hand.
#
# Together these two flags make cargo-deb emit `try-restart`, guarded by "is
# there a previous version": on a fresh install nothing starts, and on an upgrade
# the service comes back only if it was already running. Which is exactly the
# rule an operator would write themselves.
[package.metadata.deb.systemd-units]
unit-scripts = "../packaging/systemd"
enable = false
start = false
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "arvolo-relay"
assets = [
    { source = "target/release/arvolo-relay", dest = "/usr/bin/arvolo-relay", mode = "755" },
    { source = "packaging/systemd/arvolo-relay.service", dest = "/usr/lib/systemd/system/arvolo-relay.service", mode = "644" },
    { source = "packaging/arvolo-relay.default", dest = "/etc/default/arvolo-relay", mode = "644", config = true },
    { source = "docs/DEPLOY.md", dest = "/usr/share/doc/arvolo-relay/DEPLOY.md", mode = "644" },
]

# The same two rules on the RPM side, written out because cargo-generate-rpm has
# no equivalent of the systemd-units table: rpm passes the number of instances
# that will remain, so `$1 -ge 1` is "this is an upgrade" and `$1 -eq 0` is "this
# is the last one going away". Deliberately no `preset` on install — that is the
# line that would enable it, and this package does not decide that.
post_install_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl --no-reload disable --now arvolo-relay.service >/dev/null 2>&1 || :
fi
"""
post_uninstall_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
if [ $1 -ge 1 ]; then
    systemctl try-restart arvolo-relay.service >/dev/null 2>&1 || :
fi
"""
