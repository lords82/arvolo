[package]
name = "arvolo-relay"
description = "Arvolo self-hostable zero-knowledge relay / mailbox (store-and-forward with expiry)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "relay", "zero-knowledge", "mailbox", "p2p"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "arvolo-relay"
path = "src/main.rs"

[dependencies]
arvolo-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
data-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"

[dev-dependencies]
arvolo-core.workspace = true
# The inbox tests assemble a session token by hand, to check that a signature from
# the wrong identity is refused.
postcard = { version = "1", features = ["alloc"] }
tempfile = "3"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7" }
http-body-util = "0.1"
data-encoding = "2"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# ---- distro packages -------------------------------------------------------
#
# The binary and nothing else, deliberately. A package that also installed a
# system service would have to decide which user it runs as, where its data
# lives, and how it is configured — decisions this project makes in its Docker
# deployment (see docs/DEPLOY.md), and which would be quietly contradicted by a
# unit file shipped here. Install the binary, then run it however you run
# services.

[package.metadata.deb]
name = "arvolo-relay"
maintainer = "Lorenzo Bonacucina <info@termox.it>"
section = "net"
priority = "optional"
extended-description = """\
The self-hostable Arvolo relay: store-and-forward mailbox, rendezvous and swarm \
tracker. It never sees plaintext or keys — only ciphertext and opaque tokens."""
depends = "$auto"
assets = [
    ["target/release/arvolo-relay", "usr/bin/", "755"],
    ["../docs/DEPLOY.md", "usr/share/doc/arvolo-relay/DEPLOY.md", "644"],
]

[package.metadata.generate-rpm]
name = "arvolo-relay"
assets = [
    { source = "target/release/arvolo-relay", dest = "/usr/bin/arvolo-relay", mode = "755" },
    { source = "docs/DEPLOY.md", dest = "/usr/share/doc/arvolo-relay/DEPLOY.md", mode = "644" },
]
