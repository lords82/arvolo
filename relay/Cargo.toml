[package]
name = "arvolo-relay"
description = "Arvolo self-hostable zero-knowledge relay / mailbox (store-and-forward with expiry)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["file-transfer", "relay", "zero-knowledge", "mailbox", "p2p"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "arvolo-relay"
path = "src/main.rs"

[dependencies]
arvolo-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
data-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1"

[dev-dependencies]
arvolo-core.workspace = true
# The inbox tests assemble a session token by hand, to check that a signature from
# the wrong identity is refused.
postcard = { version = "1", features = ["alloc"] }
tempfile = "3"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7" }
http-body-util = "0.1"
data-encoding = "2"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# ---- distro packages -------------------------------------------------------
#
# The binary plus a systemd unit, handled the way a distribution handles one.
# Shipping a service means answering three questions — which user, where the data
# lives, how it is configured — and the unit answers them without deciding
# anything else for the operator: DynamicUser (a user that exists only while it
# runs), StateDirectory=/var/lib/arvolo-relay, and /etc/default/arvolo-relay for
# everything they would want different.
#
# It follows each ecosystem's own convention rather than one rule for both,
# because the two disagree on purpose. Debian enables and starts a daemon on
# install (`policy-rc.d` is the escape hatch, which is how container builds keep
# it quiet); Fedora applies presets and leaves the switch to the admin. Both
# restart on upgrade, which is the part that matters either way: replacing the
# binary under a running relay and walking away leaves the old process serving.
#
# Worth knowing before the first `apt install`: the relay comes up listening in
# plaintext HTTP on 0.0.0.0:6282 and says so in its log. It is meant to sit
# behind a TLS-terminating proxy — /etc/default/arvolo-relay is where the address
# and the rest are set, and it survives upgrades as a conffile.

[package.metadata.deb]
name = "arvolo-relay"
maintainer = "Lorenzo Bonacucina <info@termox.it>"
section = "net"
priority = "optional"
extended-description = """\
The self-hostable Arvolo relay: store-and-forward mailbox, rendezvous and swarm \
tracker. It never sees plaintext or keys — only ciphertext and opaque tokens."""
depends = "$auto"
assets = [
    ["target/release/arvolo-relay", "usr/bin/", "755"],
    # The unit is NOT listed here: `systemd-units` below adds it, and adding it
    # twice packages it twice.
    # Under /etc, so cargo-deb marks it a conffile: operator edits survive upgrades.
    ["../packaging/arvolo-relay.default", "etc/default/arvolo-relay", "644"],
    ["../docs/DEPLOY.md", "usr/share/doc/arvolo-relay/DEPLOY.md", "644"],
]
# Required by `systemd-units`, even with nothing in it: cargo-deb writes the
# generated fragments into scripts of its own when the directory holds none.
maintainer-scripts = "../packaging/systemd"

# The Debian default, spelled out rather than inherited: enable and start on
# install, restart after an upgrade. They are cargo-deb's defaults too, and they
# are written here because a service that turns itself on is a decision someone
# should be able to find, not one they discover by installing the package.
#
# `restart-after-upgrade` is the interesting one: the alternative is stop-then-
# unpack-then-start, which is a longer outage for no benefit here — the relay
# holds no in-memory state that a moment of overlap would corrupt.
[package.metadata.deb.systemd-units]
unit-scripts = "../packaging/systemd"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "arvolo-relay"
assets = [
    { source = "target/release/arvolo-relay", dest = "/usr/bin/arvolo-relay", mode = "755" },
    { source = "packaging/systemd/arvolo-relay.service", dest = "/usr/lib/systemd/system/arvolo-relay.service", mode = "644" },
    { source = "packaging/arvolo-relay.default", dest = "/etc/default/arvolo-relay", mode = "644", config = true },
    { source = "docs/DEPLOY.md", dest = "/usr/share/doc/arvolo-relay/DEPLOY.md", mode = "644" },
]

# The RPM side, written out because cargo-generate-rpm has no equivalent of the
# systemd-units table. These are the %systemd_post / %systemd_preun /
# %systemd_postun_with_restart macros by hand: rpm passes the number of instances
# that will remain, so `$1 -eq 1` is a first install, `$1 -ge 1` an upgrade, and
# `$1 -eq 0` the last one going away.
#
# `preset` and not `enable`, and that is not an oversight: on the RPM side the
# distribution's presets decide whether a service starts, and a package that
# forces it overrides a policy that is not its own. Fedora's convention differs
# from Debian's here, so this file follows each rather than imposing one.
post_install_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
if [ $1 -eq 1 ]; then
    systemctl --no-reload preset arvolo-relay.service >/dev/null 2>&1 || :
fi
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl --no-reload disable --now arvolo-relay.service >/dev/null 2>&1 || :
fi
"""
post_uninstall_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
if [ $1 -ge 1 ]; then
    systemctl try-restart arvolo-relay.service >/dev/null 2>&1 || :
fi
"""
