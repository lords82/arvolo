name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Windows is a best-effort prebuilt (install.sh falls back to cargo there), so
    # a Windows build failure must NOT block publishing the Linux/macOS release.
    continue-on-error: ${{ matrix.label == 'windows-x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: macos-latest, label: macos-universal }
          - { os: windows-latest, label: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        if: matrix.label != 'macos-universal'
        run: |
          cargo build --release --locked -p arvolo-cli -p arvolo-relay
          echo "PKGDIR=target/release" >> "$GITHUB_ENV"
        shell: bash
      # macOS ships one archive for both kinds of Mac instead of one per chip.
      # Built by compiling twice and joining the results with `lipo`, which is
      # how a Mach-O binary carries two architectures in one file — the same
      # mechanism macOS itself used through the PowerPC and Intel transitions.
      #
      # Cross-compiled from the arm64 runner rather than built on an Intel one.
      # GitHub's Intel macOS runners are the last of their line, and a job that
      # needs them is a job with an expiry date; this one has none.
      - name: Build (macOS, both architectures)
        if: matrix.label == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin -p arvolo-cli -p arvolo-relay
          cargo build --release --locked --target aarch64-apple-darwin -p arvolo-cli -p arvolo-relay
          mkdir -p universal
          for b in arvolo arvolo-relay; do
            lipo -create -output "universal/$b" \
              "target/x86_64-apple-darwin/release/$b" \
              "target/aarch64-apple-darwin/release/$b"
            lipo -info "universal/$b"
          done
          echo "PKGDIR=universal" >> "$GITHUB_ENV"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar czf "arvolo-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" -C "$PKGDIR" arvolo arvolo-relay
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/arvolo.exe, target/release/arvolo-relay.exe -DestinationPath "arvolo-${{ github.ref_name }}-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: arvolo-${{ github.ref_name }}-*

  # The desktop app for Windows. Same three steps as the other two bundles: build
  # the CLI, put it where the bundler expects a sidecar, bundle.
  #
  # Unsigned — the one bundle still shipped that way, now that the .dmg is
  # signed in CI: SmartScreen shows "Windows protected your PC" and hides the
  # Run button behind "More info". Signing needs a certificate from a CA, which
  # unlike Apple's is bought per year from a third party.
  app-windows:
    name: desktop app (msi)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Build the CLI to ship inside the app
        shell: bash
        run: |
          cargo build --release --locked -p arvolo-cli
          mkdir -p gui/src-tauri/binaries
          cp target/release/arvolo.exe "gui/src-tauri/binaries/arvolo-$(rustc -vV | sed -n 's/^host: //p').exe"
      - name: Install frontend deps
        working-directory: gui
        run: npm ci
      - name: Bundle
        working-directory: gui
        run: npm run tauri build -- --bundles msi --config src-tauri/tauri.release.conf.json
      - name: Name it after the tag
        shell: bash
        run: |
          out=$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)
          src=$(ls "$out"/release/bundle/msi/*.msi | head -1)
          cp "$src" "arvolo-${{ github.ref_name }}-windows-x86_64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: arvolo-${{ github.ref_name }}-*.msi

  # .deb and .rpm of the two command-line binaries.
  #
  # Built on the *oldest* runner still supported rather than the newest, and that
  # is the whole trick: a Rust binary links only libc, so the one thing that
  # decides where the package will install is the glibc of the machine that
  # compiled it. Built on 24.04 it demands glibc 2.39 and refuses to install on
  # Ubuntu 22.04 or Debian 12 — distributions people are still running. Built
  # here, it works on those and on everything newer.
  #
  # (The .tar.gz in the `build` job above is still produced on ubuntu-latest and
  # so carries the higher floor. Worth aligning one day; not silently, because
  # someone may be relying on a newer glibc feature.)
  linux-packages:
    name: deb + rpm (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built from source rather than downloaded. The prebuilt cargo-deb is itself
      # linked against a newer glibc than this runner has — it refused to start
      # with "GLIBC_2.39 not found" — which is precisely the problem this runner
      # was chosen to avoid, arriving from the other direction. A few minutes of
      # compilation buys a tool that runs where the packages are built.
      - name: Packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: Build
        run: cargo build --release --locked -p arvolo-cli -p arvolo-relay
      # `--no-build` on both: the release binaries are already there, and letting
      # each tool rebuild would double the work and risk two different binaries
      # ending up in the two packages.
      # A prerelease tag carries a hyphen, and both packaging worlds object — in
      # opposite ways. RPM refuses the character outright ("invalid version
      # 0.12.0-rc1"), and because both tools ran in one step that failure landed
      # *after* the two .deb files were built and took them down with it: the
      # first prerelease shipped no Linux packages at all. Debian, meanwhile,
      # accepts the hyphen and reads the tail as a package revision, which sorts
      # `0.12.0-rc1` **above** `0.12.0` — an rc apt would refuse to upgrade to the
      # real thing.
      #
      # `~` is the one character both ecosystems define as sorting *before*, which
      # is exactly what a release candidate is: 0.12.0~rc1 < 0.12.0. It is passed
      # to each tool rather than written into the manifest, because Cargo parses
      # that version as semver and rejects a tilde outright — rewriting it there
      # breaks the build before either packager sees it. A final release has no
      # hyphen, so the same line is a no-op for it.
      - name: Package
        run: |
          PKGVER="$(printf '%s' "${GITHUB_REF_NAME#v}" | tr '-' '~')"
          echo "packaging as $PKGVER"
          cargo deb --no-build -p arvolo-cli --deb-version "$PKGVER" \
            --output "arvolo_${{ github.ref_name }}_${{ matrix.arch }}.deb"
          cargo deb --no-build -p arvolo-relay --deb-version "$PKGVER" \
            --output "arvolo-relay_${{ github.ref_name }}_${{ matrix.arch }}.deb"
          cargo generate-rpm -p cli -s "version = \"$PKGVER\"" \
            --output "arvolo-${{ github.ref_name }}-${{ matrix.arch }}.rpm"
          cargo generate-rpm -p relay -s "version = \"$PKGVER\"" \
            --output "arvolo-relay-${{ github.ref_name }}-${{ matrix.arch }}.rpm"
      - name: What did we actually build
        run: |
          for f in *.deb; do echo "== $f"; dpkg-deb -I "$f" | sed -n 's/^ //p' | head -12; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm

  # The desktop app as a .dmg, which is what someone who is not going to open a
  # terminal can actually install. Separate from `build` because it is a different
  # thing to build — node, the frontend, and the Tauri bundler — and because a
  # failure here must not hold back the CLI tarballs that `install.sh` resolves.
  app-macos:
    name: desktop app (dmg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      # The CLI goes *inside* the app. The GUI starts the daemon by looking for an
      # `arvolo` binary next to its own executable and only then falls back to
      # PATH, so an app shipped alone would work solely on machines that already
      # have the CLI installed — which is precisely the audience a .dmg is for.
      # Tauri's externalBin puts it there and strips the target triple.
      #
      # Built for both architectures, because the app is: one .dmg that runs on
      # any Mac. All three names are written on purpose. Tauri picks a sidecar by
      # the target triple of the build, and for a universal build the triple it
      # asks for is not something to guess at from a machine that cannot run the
      # installer — so both single-architecture names and the joined one are laid
      # out, and whichever it reaches for is there. The unused ones are ignored.
      - name: Build the CLI to ship inside the app
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin -p arvolo-cli
          cargo build --release --locked --target aarch64-apple-darwin -p arvolo-cli
          mkdir -p gui/src-tauri/binaries
          cp target/x86_64-apple-darwin/release/arvolo gui/src-tauri/binaries/arvolo-x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/arvolo gui/src-tauri/binaries/arvolo-aarch64-apple-darwin
          lipo -create -output gui/src-tauri/binaries/arvolo-universal-apple-darwin \
            gui/src-tauri/binaries/arvolo-x86_64-apple-darwin \
            gui/src-tauri/binaries/arvolo-aarch64-apple-darwin
          lipo -info gui/src-tauri/binaries/arvolo-universal-apple-darwin
      - name: Install frontend deps
        working-directory: gui
        run: npm ci
      - name: Bundle
        working-directory: gui
        # The sidecar is declared in a release-only config, merged over the base
        # one. In the main config it would make `tauri dev` demand a built CLI
        # before it would start, which is a tax on every day of work for the sake
        # of a file that only matters when a release is cut.
        #
        # The same config names the Developer ID identity; these secrets are how
        # the runner comes to hold it. APPLE_CERTIFICATE is the exported .p12,
        # base64-encoded — the bundler imports it into a throwaway keychain that
        # dies with the job. The APPLE_ID trio sends the signed app to Apple's
        # notary and waits for the verdict. There is deliberately no unsigned
        # fallback for a runner without the secrets: a release .dmg that only
        # sometimes passes Gatekeeper is worse than a visibly failed job.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.release.conf.json
      # Asked for rather than assumed: `arvolo-gui` is a workspace member, so its
      # artifacts land in the workspace's target directory and not in the crate's.
      # Guessing the crate-local path found nothing, and the job failed *after* a
      # successful build — the most expensive way to be wrong.
      #
      # Searched for rather than spelled out, because `--target` moves the bundle
      # under a per-target directory: the path that was right yesterday is wrong
      # today, and would fail at the last step of a job that had already done all
      # the work. The check on the result is what makes the search honest.
      - name: Name it after the tag
        run: |
          out=$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)
          src=$(find "$out" -path '*/release/bundle/dmg/*.dmg' | head -1)
          [ -n "$src" ] || { echo "no .dmg produced under $out"; exit 1; }
          cp "$src" "arvolo-${{ github.ref_name }}-macos-universal.dmg"
      # "Universal" is a claim about what is inside, so it gets checked before
      # anyone downloads it: open the disk image and ask each of the two binaries
      # which architectures it holds. A single-architecture app under a universal
      # name is worse than no universal build at all — it fails on the machines
      # the name promises, and only there.
      - name: Both architectures, or it is not universal
        run: |
          hdiutil attach "arvolo-${{ github.ref_name }}-macos-universal.dmg" \
            -nobrowse -readonly -mountpoint /tmp/dmg >/dev/null
          status=0
          for b in arvolo-gui arvolo; do
            info=$(lipo -info "/tmp/dmg/Arvolo.app/Contents/MacOS/$b")
            echo "$info"
            case "$info" in
              *x86_64*arm64* | *arm64*x86_64*) ;;
              *) echo "::error::$b is not a universal binary"; status=1 ;;
            esac
          done
          hdiutil detach /tmp/dmg >/dev/null
          exit $status
      # The app inside was notarized and stapled by the bundler; the disk image
      # is a separate file with a separate verdict, so it goes to the notary too
      # and carries its own stapled ticket. That is what lets Gatekeeper clear
      # the download before it is even opened — and with no network at all.
      - name: Notarize and staple the .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "arvolo-${{ github.ref_name }}-macos-universal.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "arvolo-${{ github.ref_name }}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: arvolo-${{ github.ref_name }}-*.dmg

  # The desktop app for Linux, as an AppImage and nothing else.
  #
  # Not a .deb of the GUI, and the reason is not laziness. The app links
  # WebKitGTK, which ships in two incompatible lines: 4.0 (libsoup2) and 4.1
  # (libsoup3). Tauri 2 needs 4.1. A .deb would declare a dependency on
  # `libwebkit2gtk-4.1-0`, a package that does not exist at all on Ubuntu 22.04
  # or Debian 12 — so apt there does not warn, it refuses. One .deb per
  # distribution release would be the alternative, each with its own lifetime.
  # An AppImage carries its libraries with it and asks the system for nothing.
  #
  # What it does not escape is glibc: the floor is the builder's, so this runs on
  # 24.04-era distributions and newer. That is the same audience anyway, since
  # older ones cannot supply webkit2gtk-4.1 in the first place.
  app-linux:
    name: desktop app (AppImage)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Desktop toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential file fuse3
      # Same reason as the .dmg: the app starts its daemon by looking for an
      # `arvolo` binary beside its own executable.
      - name: Build the CLI to ship inside the app
        run: |
          cargo build --release --locked -p arvolo-cli
          mkdir -p gui/src-tauri/binaries
          cp target/release/arvolo "gui/src-tauri/binaries/arvolo-$(rustc -vV | sed -n 's/^host: //p')"
      - name: Install frontend deps
        working-directory: gui
        run: npm ci
      - name: Bundle
        working-directory: gui
        run: npm run tauri build -- --bundles appimage --config src-tauri/tauri.release.conf.json
      - name: Name it after the tag
        run: |
          out=$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)
          src=$(ls "$out"/release/bundle/appimage/*.AppImage | head -1)
          cp "$src" "arvolo-${{ github.ref_name }}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: arvolo-${{ github.ref_name }}-*.AppImage

  release:
    name: publish
    needs: [build, app-macos, app-linux, app-windows, linux-packages]
    runs-on: ubuntu-latest
    steps:
      # The full history, and BEFORE download-artifact: checkout cleans the
      # workspace, and the lineage check below needs main to compare against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag cut from a work branch produces a release for trying things out,
      # not the one `install.sh` should resolve: mark it Pre-release and leave
      # "latest" pointing at the last release whose commit main actually
      # contains. Nothing to remember at tag time — lineage decides.
      - name: Is this tag on main?
        id: lineage
        run: |
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Checksums so `install.sh` can verify downloads.
      - name: Checksums
        run: (cd dist && sha256sum arvolo* > SHA256SUMS)
      # Published directly (non-draft); marked latest only from main, so
      # `install.sh`'s `releases/latest` lookup never lands on a work-branch cut.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.lineage.outputs.prerelease }}
          make_latest: ${{ steps.lineage.outputs.prerelease == 'false' }}
          # The .dmg is signed with a Developer ID and notarized, so macOS opens
          # it without complaint. The .msi still is not signed — so whoever
          # downloads it needs to be told the one gesture that gets past
          # SmartScreen, in the release itself rather than in an issue opened
          # three days later.
          append_body: true
          body: |
            ### macOS: signed and notarized

            The `.dmg` is signed with an Apple Developer ID (CryCatch S.r.l.)
            and notarized by Apple — it opens like any other download.

            ### Windows: the .msi is unsigned

            SmartScreen will say it protected your PC. Choose **More info**, then
            **Run anyway**. The installer is not signed with a code-signing
            certificate — a separate purchase from Apple's, and from a different
            kind of authority.

            The `.tar.gz` archives are the command-line tools (`arvolo`,
            `arvolo-relay`) and are affected by neither.

            ### macOS: one download for every Mac

            There is no separate Intel build to choose. Both the `.dmg` and the
            macOS `.tar.gz` are universal — each binary inside carries both
            architectures, so the same file runs on Apple Silicon and on Intel.

  docker:
    name: relay image (ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same lineage rule as `publish`: the server pulls `:latest`, so an image
      # built from a work-branch tag must not claim it — it keeps only its
      # version tag until the commit reaches main.
      - name: Is this tag on main?
        id: lineage
        run: |
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arvolo-relay
          # v0.1.0 -> tags 0.1.0 and latest — latest only from main
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.lineage.outputs.on_main == 'true' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
