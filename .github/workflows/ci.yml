name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The workspace contains the Tauri desktop crate, which on Linux links GTK
      # and WebKitGTK — neither of which a runner has. Without these the job died
      # in under a minute on "the system library glib-2.0 was not found", and had
      # been dying that way since the GUI joined the workspace: main was red for a
      # missing apt package while everyone read it as "the tests are flaky".
      #
      # webkit2gtk **4.1** specifically (libsoup3): Tauri 2 does not build against
      # the 4.0 line, which is why this job cannot move to an older runner.
      - name: Desktop toolkit (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential file
      - name: Build
        run: cargo build --all-targets --locked
      # Nextest for per-test timeouts and one-process-per-test isolation (see
      # .config/nextest.toml for why this suite needs both). It does not run
      # doctests — those keep going through `cargo test`.
      - name: Test
        run: cargo nextest run --locked --profile ci
      - name: Doctests
        run: cargo test --doc --locked
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  relay-image:
    # Build (never push) the same image release.yml publishes on a tag. The
    # Dockerfile's dependency-cache stage lists every workspace member's
    # manifest by hand, so it silently falls behind whenever a member joins the
    # workspace — that exact rot once broke the image for months and nobody
    # noticed, because a tag was the first time anyone built it. This makes
    # every PR the first time.
    name: relay image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hard gate: licenses must stay compatible with the AGPL + commercial
      # dual-license model, sources must be crates.io, no banned crates.
      - name: License / sources / bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      # Informational: surface security advisories without blocking the build.
      # Current findings are transitive through iroh (see deny.toml).
      - name: Security advisories (non-blocking)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
